# GitHub Actions CI：push / PR 时自动跑后端测试
#
# 这个文件放在 .github/workflows/ 下，GitHub 会自动识别并运行。
# 不用注册、不用本地装任何东西，推上去就生效，在仓库的 Actions 标签页看结果。
#
# 当前只跑后端 3 套测试（都是 mock，不连真实数据库/LLM，云端也能跑）。
# 前端 build、Docker 构建以后需要了再加。

name: CI

# 触发时机：推到这些分支，或向它们发 PR
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: 后端测试
    runs-on: ubuntu-latest

    steps:
      # 1. 把仓库代码拉到运行环境
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 装 Python（和本地一致用 3.11）
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. 装后端依赖
      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 跑测试。任意一套失败，这一步就红，整个 CI 失败
      #    测试都是 mock / 本地假上游，不需要真实 config.json / 数据库 / LLM
      - name: 运行测试
        working-directory: backend
        run: |
          python enhancement_test.py
          python simulation_test.py
          python model_route_test.py
          python loop_affinity_test.py
